{% import "macros/images.html" as images %}
{% set gallery_id = id | default(value="gallery-" ~ range(end=9999) | first) %}
{% set image_list = body | trim | split(pat="
") %}
<div class="gallery" data-gallery-id="{{ gallery_id }}">
    <div class="gallery-grid">
        {% for img_path in image_list %}
        {% if img_path | trim != "" %}
        <figure class="gallery-item img-skeleton" data-index="{{ loop.index0 }}">
            {{ images::gallery_image(url=img_path | trim, alt="", onclick="openLightbox('" ~ gallery_id ~ "', " ~ loop.index0 ~ ")") }}
        </figure>
        {% endif %}
        {% endfor %}
    </div>
</div>
