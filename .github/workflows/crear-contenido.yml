name: Crear Contenido desde Issue

on:
  issues:
    types: [opened]

# ============================================================================
# CONFIGURACIÓN
# ============================================================================
env:
  # Usuarios autorizados para crear contenido (separados por coma)
  AUTHORIZED_USERS: "Chemaclass,fsangom"


permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: content-writer
  cancel-in-progress: false

jobs:
  create-content:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
      content_path: ${{ steps.create.outputs.content_path }}
    if: contains(github.event.issue.labels.*.name, 'nuevo-articulo') || contains(github.event.issue.labels.*.name, 'nueva-investigacion') || contains(github.event.issue.labels.*.name, 'nuevo-trabajo') || contains(github.event.issue.labels.*.name, 'nueva-publicacion')

    steps:
      - name: Check authorized user
        id: auth
        run: |
          AUTHOR="${{ github.event.issue.user.login }}"
          if [[ ",$AUTHORIZED_USERS," == *",$AUTHOR,"* ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "User $AUTHOR is authorized"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "User $AUTHOR is NOT authorized"
          fi

      - name: Reject unauthorized user
        if: steps.auth.outputs.authorized == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **No autorizado**\n\nLo siento, solo usuarios autorizados pueden crear contenido a traves de este formulario.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            core.setFailed('User not authorized');

      - name: Checkout
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Parse issue and create content
        id: create
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { createContent, saveContent } = require('./.github/scripts/content-creator.js');
            const fs = require('fs');

            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number });
            const labels = issue.labels.map(l => l.name);

            const result = createContent(issue.body, labels, { defaultDate: issue.created_at.slice(0, 10), issueNumber: issue.number });

            saveContent(result, fs);
            console.log(`Created: ${result.filename}`);

            core.setOutput('filename', result.filename);
            core.setOutput('content_path', result.filename.replace(/^content\//, '').replace(/\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, '/'));
            core.setOutput('content_type', result.contentType);

      - name: Install Zola
        if: steps.auth.outputs.authorized == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: Validate generated site before saving
        if: steps.auth.outputs.authorized == 'true'
        run: zola build

      - name: Commit and push
        id: commit
        if: steps.auth.outputs.authorized == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat: add new content from issue #${{ github.event.issue.number }}"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report publication failure
        if: failure() && steps.auth.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `No se ha publicado el contenido. [Revisa el error](${runUrl}). Corrige el formulario si es necesario y vuelve a ejecutar esta ejecución; no abras otro formulario.`
            });

  publish:
    needs: create-content
    if: needs.create-content.outputs.revision != ''
    uses: ./.github/workflows/main.yml
    with:
      revision: ${{ needs.create-content.outputs.revision }}
      content_path: ${{ needs.create-content.outputs.content_path }}
      issue_number: ${{ github.event.issue.number }}
