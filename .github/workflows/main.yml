# On every push this script is executed
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''
      content_path:
        type: string
        default: ''
      languages:
        type: string
        default: ''
      issue_number:
        type: number
        default: 0

name: Build and deploy GH Pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: Build with Zola
        env:
          ZOLA_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          zola build

      - name: Check page metadata and language links
        run: python3 .github/scripts/check-metadata.py

      - name: Verify requested page is in the artifact
        if: inputs.content_path != ''
        env:
          CONTENT_PATH: ${{ inputs.content_path }}
        run: test -f "public/$CONTENT_PATH/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: always() && inputs.issue_number > 0
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.revision }}
      - name: Report deployment outcome
        uses: actions/github-script@v7
        env:
          DEPLOYED: ${{ needs.deploy.result == 'success' }}
          LANGUAGES: ${{ inputs.languages }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          CONTENT_PATH: ${{ inputs.content_path }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const { publicationStatus } = require('./.github/scripts/publication-status');
            const deployed = process.env.DEPLOYED === 'true';
            const result = publicationStatus({
              deployed,
              languages: process.env.LANGUAGES,
              pageUrl: deployed ? new URL(process.env.CONTENT_PATH, process.env.PAGE_URL.replace(/\/?$/, '/')).href : '',
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            const issue = { ...context.repo, issue_number: Number(process.env.ISSUE_NUMBER) };
            await github.rest.issues.createComment({ ...issue, body: result.body });
            await github.rest.issues.update({ ...issue, state: result.state });
